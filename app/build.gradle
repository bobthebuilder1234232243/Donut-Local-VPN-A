plugins {
    id 'com.android.application'
}

android {
    namespace 'com.donutvpn.donutlocalvpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.donutvpn.donutlocalvpn'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '0.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The language picker uses resources directly; keep every locale in an app bundle.
    bundle {
        language {
            enableSplit = false
        }
    }
}

// Uygulamanin kendisi bagimlilik kullanmaz; bunlar yalnizca instrumented smoke test icin.
dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
